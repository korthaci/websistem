<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Sistem Documentation</title>
    <script>
        (function () {
            var stored = localStorage.getItem('docsLang');
            var browserLang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
            var lang = stored || (browserLang.indexOf('tr') === 0 ? 'tr' : 'en');
            if (lang !== 'tr' && lang !== 'en') lang = 'en';
            window.location.replace('./' + lang + '/');
        })();
    </script>
</head>

<body>
    <noscript>
        <p>Select language:</p>
        <ul>
            <li><a href="./tr/">Türkçe</a></li>
            <li><a href="./en/">English</a></li>
        </ul>
    </noscript>
</body>

</html>
