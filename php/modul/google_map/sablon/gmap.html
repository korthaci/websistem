<div class="no-container">
    <div id="googlemaps" style="margin-bottom: -40px;" data-key="{{$:GOOGLE_MAP_KEY}}"
        data-center-lat="BURAYA-MERKEZ-LATITUDE-YAZILACAK" data-center-lng="BURAYA-MERKEZ-LONGITUDE-YAZILACAK"
        data-aciklama="BURAYA-EK-ACIKLAMA-YAZILACAK" data-zoom="15" data-map-style="retro" data-scroll="0"
        data-map-id="google_map_avd" data-show-info="true" data-auto-open-info="true" data-marker-size="32"
        data-pin-pulse="0">
    </div>
</div>
<!--     Google Maps Modül Ayarları:        data-map-type : Harita tipi. Alternatifler: &#39;roadmap&#39; (Varsayılan), &#39;satellite&#39; (Uydu), &#39;hybrid&#39; (Hibrit), &#39;terrain&#39; (Arazi).    data-map-style: Harita renk stili. &#39;retro&#39; (Varsayılan), &#39;standard&#39;, &#39;dark&#39;, &#39;night&#39;, &#39;aubergine&#39;, &#39;silver&#39;.                   Özel JSON stili kullanmak isterseniz bu alanı boş bırakıp JS içinden stil tanımlayabilirsiniz.   data-pin-pulse: Marker (işaretçi) etrafında animasyonlu halka efekti. &#39;0&#39; = Kapalı, &#39;1&#39; = Açık.                    Dikkat: Eğer &#39;data-map-style&#39; tanımlıysa pulse efekti veya özel marker stili bazı durumlarda baskılanabilir.    data-scroll   : Fare ile yakınlaştırma (scroll zoom). &#39;0&#39; = Kapalı (önerilen), &#39;1&#39; = Açık.    data-auto-open-info: Sayfa yüklendiğinde bilgi balonunu otomatik aç. &#39;true&#39; veya &#39;false&#39;.-->
